spring.application.name=geekhub

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=geekhub
spring.datasource.password=geekhub
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.clean-disabled=false

spring.web.error.include-message=always

jwt.public.key=classpath:authz.pub
jwt.private.key=classpath:authz.pem
